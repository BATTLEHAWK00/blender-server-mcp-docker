services:
  blender:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: ${BLENDER_SERVER_IMAGE:-blender-server:local}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-21849}:10849"
    environment:
      WORK_DIR: /work
      API_TOKEN: ${API_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
      RENDER_TIMEOUT: ${RENDER_TIMEOUT:-1800}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    volumes:
      - ./work:/work
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10849/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    restart: unless-stopped
